[package]
name = "stellar-membership"
version = "2.0.0"
description = "Soulbound membership token of the Stellar community"
edition = "2024"
license = "BSD-3"
repository = "https://radicle.network/nodes/radicle.consulting-manao.com/rad%3Az4KRDyBiL6kP6n5FWP6kJWga6BXJV"
authors = ["Consulting Manao GmbH"]
publish = false

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = "28.0.0-rc.1"

[dev-dependencies]
soroban-sdk = { version = "28.0.0-rc.1", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
