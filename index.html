<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b12" />
    <title>Stellar Members</title>
    <meta
      name="description"
      content="Join the Stellar community: verify your accounts and mint your membership."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Stellar Members" />
    <meta
      property="og:description"
      content="Join the Stellar community: verify your accounts and mint your membership."
    />
    <meta property="og:image" content="/social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stellar Members" />
    <meta name="twitter:image" content="/social-card.png" />
    <script>
      try {
        const theme = localStorage.getItem("theme");
        const dark =
          theme === "dark" ||
          (!theme && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
