[workspace]
resolver = "2"
members = ["contracts/stellar-membership"]

[workspace.package]
authors = ["Consulting Manao GmbH"]
edition = "2024"
license = "BSD-3-Clause"
repository = "https://radicle.network/nodes/radicle.consulting-manao.com/rad%3Az4KRDyBiL6kP6n5FWP6kJWga6BXJV"

[workspace.dependencies]
soroban-sdk = { version = "28.0.0-rc.1" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
